<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排版编辑器 · 小票解码</title>
<link rel="stylesheet" href="layout-editor.css?v=typesetting">
<link rel="stylesheet" href="turris-theme.css?v=shopping-aligned">
<script src="layout-tool.js?v=fullscreen-fit" defer></script>
</head>
<body class="layout-editor">
<aside class="editor-panel" aria-label="排版控制">
  <header>
    <p class="editor-kicker">FOOD DECODE</p>
    <h1>排版编辑器</h1>
  </header>
  <nav class="editor-scenes" aria-label="选择画面">
    <button type="button" data-layout-scene="p1">P1 档案墙</button>
    <button type="button" data-layout-scene="p2">P2 购物篮</button>
    <button type="button" data-layout-scene="p3">P3 数据</button>
    <button type="button" data-layout-scene="p4">P4 人格小票</button>
    <button type="button" data-layout-scene="intro">首页</button>
  </nav>
  <fieldset class="editor-modes">
    <legend>编辑模式</legend>
    <label><input type="radio" name="layout-mode" value="block" checked> 区块</label>
    <label><input type="radio" name="layout-mode" value="text"> 文字</label>
    <label><input type="radio" name="layout-mode" value="preview"> 预览</label>
  </fieldset>
  <label class="editor-field" for="layout-target">选择对象</label>
  <select id="layout-target"></select>
  <p id="layout-hint" class="editor-help"></p>
  <div class="editor-numbers">
    <label for="layout-x">横向位移 <span>px</span><input id="layout-x" type="number" min="-1800" max="1800" step="1"></label>
    <label for="layout-y">纵向位移 <span>px</span><input id="layout-y" type="number" min="-900" max="900" step="1"></label>
    <label for="layout-size">整体大小 <span>%</span><input id="layout-size" type="number" min="25" max="250" step="1"></label>
    <label for="layout-width">宽度 <span>px</span><input id="layout-width" type="number" min="1" max="1800" step="1" placeholder="原值"></label>
    <label for="layout-height">高度 <span>px</span><input id="layout-height" type="number" min="1" max="900" step="1" placeholder="原值"></label>
    <label for="layout-gap">间距 <span>px</span><input id="layout-gap" type="number" min="0" max="180" step="1" placeholder="原值"></label>
    <label for="layout-columns">每行列数<input id="layout-columns" type="number" min="3" max="10" step="1" placeholder="6"></label>
    <label for="layout-split">左栏宽度 <span>px</span><input id="layout-split" type="number" min="160" max="700" step="1" placeholder="原值"></label>
    <label for="layout-font">字号 <span>px</span><input id="layout-font" type="number" min="6" max="160" step="1" placeholder="原值"></label>
    <label for="layout-leading">行高 <span>px</span><input id="layout-leading" type="number" min="6" max="200" step="1" placeholder="原值"></label>
    <label for="layout-tracking">字间距 <span>px</span><input id="layout-tracking" type="number" min="-10" max="30" step="0.1" placeholder="原值"></label>
  </div>
  <label id="layout-composition-field" class="editor-composition" for="layout-composition" hidden>肖像排法
    <select id="layout-composition"><option value="0">居中上下排</option><option value="1">左图右文</option><option value="2">右图左文</option></select>
  </label>
  <button type="button" id="layout-reset-item" class="editor-secondary">重置当前对象</button>
  <div class="editor-export">
    <button type="button" id="layout-export">导出排版 CSS</button>
    <p class="editor-help">用导出的 <code>layout-overrides.css</code> 替换网页目录里的同名文件，再刷新正式网页。</p>
    <p id="layout-status" role="status" class="editor-help"></p>
    <a href="index.html" target="_blank" rel="noopener">打开正式网页 ↗</a>
  </div>
</aside>
<iframe id="layout-preview" title="小票解码排版预览"></iframe>
</body>
</html>
